<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surah Al-Baqarah 1-3 · Clean Broadcast Test</title>

    <!-- FONT IMPORTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <style>
        /* خط عثمان طه النسخ (مصحف المدينة المنورة الإصدار العاشر) عبر jsDelivr */
        @font-face {
            font-family: 'UthmanTahaNaskh';
            src: url('https://cdn.jsdelivr.net/gh/mo7ammedreyad1/Assets@main/alfont_com_UthmanTN1-Ver10.otf.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020b06; color: #FFF8E7;
            font-family: 'UthmanTahaNaskh', 'IBM Plex Sans Arabic', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 10px;
        }
        #viewport {
            position: relative; max-height: 86vh; max-width: 94vw; width: auto; height: auto;
            background: #0f0804; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95), 0 0 1px 1px rgba(212, 175, 55, 0.15);
            border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        /* واجهات التحكم - سيتم إخفاؤها تماماً أثناء البث المباشر */
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(18, 10, 5, 0.9); backdrop-filter: blur(14px);
            color: #FFF8E7; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); border: 1px solid rgba(212, 175, 55, 0.25); z-index: 10;
        }
        .spinner { width: 12px; height: 12px; border: 2px solid rgba(212, 175, 55, 0.2); border-top: 2px solid #d4af37; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 10px; z-index: 10; background: rgba(18, 10, 5, 0.94);
            padding: 8px 18px; border-radius: 40px; backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .btn { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-preview { background: rgba(255, 248, 231, 0.1); color: #FFF8E7; }
        .btn-preview:hover { background: rgba(212, 175, 55, 0.25); color: #d4af37; }
        
        #seek-slider { width: 200px; max-width: 26vw; height: 5px; -webkit-appearance: none; background: rgba(255, 248, 231, 0.2); border-radius: 5px; outline: none; cursor: pointer; }
        #seek-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #d4af37; cursor: pointer; box-shadow: 0 0 8px rgba(212, 175, 55, 0.8); }
        #time-label { font-family: 'Plus Jakarta Sans', monospace; font-size: 11px; color: rgba(255, 248, 231, 0.75); min-width: 75px; text-align: center; }

        #console-modal { display:none; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري التجهيز...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-play-pause"><i class="ph-fill ph-pause" id="icon-play-pause"></i> <span id="text-play-pause">إيقاف</span></button>
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1">
            <span id="time-label">00:00 / 00:00</span>
        </div>
    </div>
    <div id="console-modal"></div>

    <script type="module">
        // =========================================================================
        // 1. CONFIG & METADATA (SURAH AL-BAQARAH 1-3)
        // =========================================================================
        export const CONFIG = { fps: 30, width: 1080, height: 1920, duration: 40.0 };
        export const OUTPUT_FILENAME = 'quran_baqarah_1_to_3_live';
        export let audioBuffer = null;

        const TOTAL_AYAHS = 3;
        let streamData = Array.from({ length: TOTAL_AYAHS }, (_, i) => ({
            number: i + 1, quranLines: [], quranFontSize: 60, quranLineHeight: 95,
            rawTafsir: "", start: i * 13.0, end: (i + 1) * 13.0
        }));

        function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // إعداد الآيات
        function formatResponsiveQuranLines(rawText, ayahNumber, maxW = 980) {
            let clean = rawText.replace(/^بِسْمِ [^ ]+ [^ ]+ [^ ]+\s*/, '').trim();
            const words = clean.split(/\s+/).filter(Boolean);

            let fontSize = 64, lineHeight = 100;
            if (words.length <= 1) { fontSize = 125; lineHeight = 160; } 
            else if (words.length <= 8) { fontSize = 68; lineHeight = 106; } 
            else if (words.length <= 16) { fontSize = 58; lineHeight = 90; } 
            else { fontSize = 50; lineHeight = 80; }

            ctx.font = `normal ${fontSize}px "UthmanTahaNaskh", "Amiri", serif`;
            const lines = [];
            let cur = "";

            for (let w of words) {
                const test = cur ? (cur + " " + w) : w;
                if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } 
                else { cur = test; }
            }
            if (cur) lines.push(cur);
            return { lines, fontSize, lineHeight };
        }

        function wrapParagraphLines(ctx, text, maxW) {
            const words = text.split(/\s+/).filter(Boolean);
            const lines = [];
            let cur = "";
            for (let w of words) {
                const test = cur ? (cur + " " + w) : w;
                if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } 
                else { cur = test; }
            }
            if (cur) lines.push(cur);
            return lines;
        }

        // إعداد التفسير
        function layoutResponsiveTafsir(ctx, text, maxW, maxAllowedH = 580) {
            let fontSize = 28, lineHeight = 46;
            let lines = [];
            const headerH = 60, topMargin = 34, bottomMargin = 30;

            while (fontSize >= 16) {
                ctx.font = `600 ${fontSize}px "IBM Plex Sans Arabic", sans-serif`;
                lineHeight = Math.round(fontSize * 1.58);
                lines = wrapParagraphLines(ctx, text, maxW);
                const totalH = headerH + topMargin + (lines.length * lineHeight) + bottomMargin;
                if (totalH <= maxAllowedH) break;
                fontSize -= 0.5;
            }
            return { lines, fontSize, lineHeight, cardH: headerH + topMargin + (lines.length * lineHeight) + bottomMargin, tStartY: headerH + topMargin };
        }

        function drawRounded(c, x, y, w, h, r) {
            c.beginPath();
            if (typeof r === 'number') c.roundRect(x, y, w, h, r);
            else c.roundRect(x, y, w, h, [r.tl || 0, r.tr || 0, r.br || 0, r.bl || 0]);
        }

        // رسم الآية ۝
        function drawAyahSymbolWithNumber(c, x, y, num, scale = 1.0) {
            c.save();
            c.translate(x, y);
            c.scale(scale, scale);
            const arabicDigits = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
            const numStr = String(num).split('').map(d => arabicDigits[parseInt(d)]).join('');
            
            c.font = 'normal 48px "Amiri", "UthmanTahaNaskh", serif';
            c.fillStyle = '#FFF8E7';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText('۝', 0, 0);

            const numFontSize = numStr.length > 2 ? 14 : (numStr.length > 1 ? 16 : 19);
            c.font = `700 ${numFontSize}px "Amiri", "IBM Plex Sans Arabic", serif`;
            c.fillStyle = '#d4af37';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText(numStr, 0, 1.5);
            c.restore();
        }

        // =========================================================================
        // 2. FETCH DATA & ASSETS
        // =========================================================================
        export async function prepareIdentity() {
            logToConsole("تحميل خط عثمان طه وجلب الآيات (1-3) من سورة البقرة...", "info");
            const fontUrl = 'https://cdn.jsdelivr.net/gh/mo7ammedreyad1/Assets@main/alfont_com_UthmanTN1-Ver10.otf.ttf';
            try {
                const customFont = new FontFace('UthmanTahaNaskh', `url('${fontUrl}')`);
                await customFont.load();
                document.fonts.add(customFont);
            } catch (err) {}

            try {
                const [qRes, tRes] = await Promise.all([
                    fetch('https://api.alquran.cloud/v1/surah/2/quran-uthmani'),
                    fetch('https://api.alquran.cloud/v1/surah/2/ar.muyassar')
                ]);
                const qJson = await qRes.json();
                const tJson = await tRes.json();
                const qAyahs = qJson.data.ayahs.slice(0, TOTAL_AYAHS);
                const tAyahs = tJson.data.ayahs.slice(0, TOTAL_AYAHS);

                qAyahs.forEach((item, idx) => {
                    const num = idx + 1;
                    const layout = formatResponsiveQuranLines(item.text, num, 980);
                    streamData[idx].quranLines = layout.lines;
                    streamData[idx].quranFontSize = layout.fontSize;
                    streamData[idx].quranLineHeight = layout.lineHeight;
                    streamData[idx].rawTafsir = tAyahs[idx].text.replace(/^[^:]+:\s*/, '').trim();
                });
            } catch (e) { throw e; }

            const audioUrls = Array.from({ length: TOTAL_AYAHS }, (_, i) => `https://everyayah.com/data/Ibrahim_Akhdar_32kbps/002${String(i + 1).padStart(3, '0')}.mp3`);
            const decodedBuffers = await Promise.all(audioUrls.map(u => fetchAndDecodeAudio(u)));
            const concat = concatenateAudioBuffers(decodedBuffers);
            audioBuffer = concat.buffer;
            CONFIG.duration = audioBuffer.duration;
            concat.segments.forEach((seg, i) => { streamData[i].start = seg.start; streamData[i].end = seg.end; });
        }

        function drawStaticCRTTelevisionScanlines(c, w, h) {
            c.save();
            c.fillStyle = 'rgba(0, 0, 0, 0.14)';
            for (let y = 0; y < h; y += 4) c.fillRect(0, y, w, 1.4);
            const vig = c.createRadialGradient(w / 2, h / 2, h * 0.38, w / 2, h / 2, h * 0.72);
            vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vig.addColorStop(0.7, 'rgba(8, 4, 2, 0.25)');
            vig.addColorStop(1, 'rgba(8, 4, 2, 0.7)');
            c.fillStyle = vig; c.fillRect(0, 0, w, h);
            c.restore();
        }

        // =========================================================================
        // 3. MAIN RENDERING LOOP
        // =========================================================================
        export async function drawSceneAtTime(time) {
            ctx.save();
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

            const bgGrad = ctx.createRadialGradient(CONFIG.width / 2, CONFIG.height * 0.42, 40, CONFIG.width / 2, CONFIG.height * 0.46, 1150);
            const ambientBreath = 0.88 + Math.sin(time * 1.3) * 0.12;
            bgGrad.addColorStop(0, '#2e180c');
            bgGrad.addColorStop(0.48 * ambientBreath, '#1d0f07');
            bgGrad.addColorStop(1, '#0f0804');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            let sceneAlpha = 1.0;
            if (time >= (CONFIG.duration - 1.2)) {
                sceneAlpha = 1.0 - easeInOutCubic(clamp((time - (CONFIG.duration - 1.2)) / 1.2, 0, 1)) * 0.12;
            }

            ctx.translate(CONFIG.width / 2, CONFIG.height / 2);
            ctx.globalAlpha = sceneAlpha;

            ctx.save();
            const topBadgeY = -890;
            const livePulse = 0.75 + Math.sin(time * 5) * 0.25;
            
            // Live indicator top left
            ctx.beginPath();
            ctx.arc(-CONFIG.width / 2 + 65, topBadgeY + 45, 8.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(239, 68, 68, ${livePulse})`;
            ctx.shadowColor = 'rgba(239, 68, 68, 0.8)';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = '700 24px "IBM Plex Sans Arabic", sans-serif';
            ctx.fillStyle = '#FFF8E7';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText('لايف', -CONFIG.width / 2 + 133, topBadgeY + 45);

            const titleY = -765;
            ctx.font = '700 68px "Reem Kufi", sans-serif';
            ctx.fillStyle = '#FFF8E7';
            ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
            ctx.shadowBlur = 24;
            ctx.textAlign = 'center';
            ctx.fillText('سُورَةُ البَقَرَةِ', 0, titleY);

            ctx.shadowBlur = 0;
            ctx.font = '500 22px "IBM Plex Sans Arabic", sans-serif';
            ctx.fillStyle = 'rgba(255, 248, 231, 0.8)';
            ctx.fillText('مَدَنِيَّةٌ · الآيَاتُ ١ - ٣ · القارئ الشيخ إبراهيم الأخضر', 0, titleY + 70);
            ctx.restore();

            let activeIdx = 0;
            for (let i = 0; i < streamData.length; i++) if (time >= streamData[i].start) activeIdx = i;

            const curData = streamData[activeIdx] || streamData[0];
            const vStart = curData.start, vEnd = curData.end;

            const enterT = easeOutQuart(clamp((time - vStart) / 1.1, 0, 1));
            let vAlpha = clamp((time - vStart) / 0.7, 0, 1);
            let vSlideY = (1 - enterT) * 35;

            if (time >= (vEnd - 0.6) && activeIdx < (streamData.length - 1)) {
                const exitT = easeInOutCubic(clamp((time - (vEnd - 0.6)) / 0.6, 0, 1));
                vAlpha = 1.0 - exitT;
                vSlideY = -exitT * 25;
            }

            ctx.save();
            ctx.globalAlpha = vAlpha * sceneAlpha;

            const lines = curData.quranLines || [];
            const fontSize = curData.quranFontSize || 60;
            const lineHeight = curData.quranLineHeight || (fontSize * 1.55);
            const quranCenterY = lines.length > 2 ? -350 : -320;
            ctx.translate(0, quranCenterY + vSlideY);

            ctx.shadowColor = 'rgba(255, 248, 231, 0.45)';
            ctx.shadowBlur = 30;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFF8E7';
            ctx.font = `normal ${fontSize}px "UthmanTahaNaskh", "Amiri", serif`;

            const startY = -((lines.length * lineHeight) / 2) + (lineHeight / 2);
            lines.forEach((line, li) => {
                const lineY = startY + li * lineHeight;
                ctx.fillText(line, 0, lineY);
                if (li === lines.length - 1) {
                    drawAyahSymbolWithNumber(ctx, -ctx.measureText(line).width / 2 - 38, lineY - 2, curData.number, 1.0);
                }
            });
            ctx.restore();

            ctx.save();
            const cardW = 1000, tafsirPaddingX = 45;
            const tafsirLayout = layoutResponsiveTafsir(ctx, curData.rawTafsir || "", cardW - (tafsirPaddingX * 2), 560);
            ctx.translate(0, 145);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 25;
            ctx.fillStyle = 'rgba(253, 248, 237, 0.96)';
            drawRounded(ctx, -cardW / 2, 0, cardW, tafsirLayout.cardH, 26); ctx.fill();

            ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)'; ctx.lineWidth = 1.4;
            drawRounded(ctx, -cardW / 2, 0, cardW, tafsirLayout.cardH, 26); ctx.stroke();

            ctx.save();
            const headerHeight = 60;
            ctx.fillStyle = 'rgba(45, 23, 11, 0.08)';
            drawRounded(ctx, -cardW / 2 + 2, 2, cardW - 4, headerHeight, { tl: 24, tr: 24, br: 0, bl: 0 }); ctx.fill();

            ctx.strokeStyle = 'rgba(45, 23, 11, 0.15)'; ctx.lineWidth = 1.0;
            ctx.beginPath(); ctx.moveTo(-cardW / 2 + 25, headerHeight); ctx.lineTo(cardW / 2 - 25, headerHeight); ctx.stroke();

            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            ctx.font = '700 20px "IBM Plex Sans Arabic", sans-serif'; ctx.fillStyle = '#2e180c';
            ctx.fillText('التَّفْسِيرُ المُيَسَّرُ · مَعَانِي الآيَاتِ', cardW / 2 - tafsirPaddingX, headerHeight / 2 + 1);

            ctx.textAlign = 'left'; ctx.font = '600 16px "Plus Jakarta Sans", "IBM Plex Sans Arabic", sans-serif';
            ctx.fillStyle = 'rgba(45, 23, 11, 0.75)';
            ctx.fillText(`سُورَةُ البَقَرَةِ · الآيَةُ (${curData.number})`, -cardW / 2 + tafsirPaddingX, headerHeight / 2 + 1);
            ctx.restore();

            ctx.font = `600 ${tafsirLayout.fontSize}px "IBM Plex Sans Arabic", sans-serif`;
            ctx.fillStyle = '#190d07'; ctx.textAlign = 'right';
            tafsirLayout.lines.forEach((line, li) => {
                ctx.fillText(line, cardW / 2 - tafsirPaddingX, tafsirLayout.tStartY + li * tafsirLayout.lineHeight);
            });
            ctx.restore();

            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = '500 19px "IBM Plex Sans Arabic", sans-serif'; ctx.fillStyle = 'rgba(255, 248, 231, 0.65)';
            ctx.fillText('تلاوة يومية خاشعة ومستمرة · تفسير وتدبر كلام الله عز وجل', 0, 825);
            ctx.restore();

            ctx.restore(); 
            drawStaticCRTTelevisionScanlines(ctx, CONFIG.width, CONFIG.height);
        }

        // =========================================================================
        // 4. TECHNICAL LAYER (RUNTIME & SYNC STREAMING)
        // =========================================================================
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlayPause = document.getElementById('icon-play-pause');
        const textPlayPause = document.getElementById('text-play-pause');
        const seekSlider = document.getElementById('seek-slider');
        const timeLabel = document.getElementById('time-label');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, isPlaying: true, animationFrameId: null };
        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') { console.log(msg); }
        function clamp01(val) { return Math.max(0, Math.min(1, val)); }
        function formatTimeSec(sec) {
            const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function getSharedAudioContext() {
            if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return sharedAudioCtx;
        }

        async function fetchAndDecodeAudio(url) {
            const res = await fetch(url);
            const arrayBuf = await res.arrayBuffer();
            return getSharedAudioContext().decodeAudioData(arrayBuf);
        }

        function concatenateAudioBuffers(buffers) {
            const sampleRate = buffers[0].sampleRate;
            const channelsCount = buffers[0].numberOfChannels;
            const totalSamples = buffers.reduce((sum, b) => sum + b.length, 0);
            const combined = getSharedAudioContext().createBuffer(channelsCount, totalSamples, sampleRate);
            let sampleOffset = 0, timeOffset = 0.0;
            const segments = [];
            for (const buf of buffers) {
                for (let ch = 0; ch < channelsCount; ch++) combined.getChannelData(ch).set(buf.getChannelData(ch), sampleOffset);
                const duration = buf.duration;
                segments.push({ start: timeOffset, end: timeOffset + duration, duration });
                sampleOffset += buf.length;
                timeOffset += duration;
            }
            return { buffer: combined, segments };
        }

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels, length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let pos = 0;
            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            for (let ch = 0; ch < numOfChan; ch++) {
                const channel = buffer.getChannelData(ch);
                let offset = 0;
                while (offset < buffer.length) {
                    let sample = Math.max(-1, Math.min(1, channel[offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(44 + (offset * numOfChan + ch) * 2, sample, true);
                    offset++;
                }
            }
            return new Blob([out], { type: "audio/wav" });
        }

        function arrayBufferToBase64(buffer) {
            let binary = ''; const bytes = new Uint8Array(buffer); const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            return btoa(binary);
        }

        // =========================================================================
        // دالة إخفاء الواجهات والتزامن الصارم للبث (Headless Live Stream Fix)
        // =========================================================================
        window.startHeadlessLiveStream = function() {
            document.getElementById('hud').style.display = 'none';
            document.getElementById('controls-overlay').style.display = 'none';
            document.getElementById('console-modal').style.display = 'none';

            const startTime = performance.now();
            function liveLoop() {
                const elapsed = (performance.now() - startTime) / 1000;
                const currTime = elapsed % CONFIG.duration;
                drawSceneAtTime(currTime);
                requestAnimationFrame(liveLoop);
            }
            requestAnimationFrame(liveLoop);
        };

        // دالة المعاينة للمتصفح فقط
        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            state.isPlaying = true;
            iconPlayPause.className = 'ph-fill ph-pause'; textPlayPause.textContent = 'إيقاف';
            if (audioAudioEl && audioAudioEl.paused) audioAudioEl.play().catch(()=>{});

            const startTime = performance.now() - (state.currentTime * 1000);
            async function loop(now) {
                if (!state.isPlaying) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = audioAudioEl ? audioAudioEl.currentTime : (elapsed % CONFIG.duration);
                state.currentTime = currTime;
                seekSlider.value = (currTime / CONFIG.duration) * 100;
                timeLabel.textContent = `${formatTimeSec(currTime)} / ${formatTimeSec(CONFIG.duration)}`;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) state.animationFrameId = requestAnimationFrame(loop);
                else { state.currentTime = 0; if (audioAudioEl) audioAudioEl.currentTime = 0; startPreviewLoop(); }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        btnPlayPause.addEventListener('click', () => {
            if (state.isPlaying) {
                state.isPlaying = false;
                if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
                if (audioAudioEl) audioAudioEl.pause();
                iconPlayPause.className = 'ph-fill ph-play'; textPlayPause.textContent = 'تشغيل';
            } else { startPreviewLoop(); }
        });

        seekSlider.addEventListener('input', async (e) => {
            const targetTime = (parseFloat(e.target.value) / 100) * CONFIG.duration;
            state.currentTime = targetTime;
            if (audioAudioEl) audioAudioEl.currentTime = targetTime;
            timeLabel.textContent = `${formatTimeSec(targetTime)} / ${formatTimeSec(CONFIG.duration)}`;
            await drawSceneAtTime(targetTime);
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width; canvas.height = CONFIG.height;
                const viewport = document.getElementById('viewport');
                viewport.style.aspectRatio = `${CONFIG.width} / ${CONFIG.height}`;
                viewport.style.width = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;
                if (audioBuffer) {
                    const wavBlob = audioBufferToWavBlob(audioBuffer);
                    audioAudioEl = new Audio(URL.createObjectURL(wavBlob));
                    window.__ofoqAudioWavBase64 = arrayBufferToBase64(await wavBlob.arrayBuffer());
                }
                statusText.textContent = "جاهز للبث والعرض والتصدير ✓";
                spinner.style.display = 'none'; window.renderStatus = 'ready';
                timeLabel.textContent = `00:00 / ${formatTimeSec(CONFIG.duration)}`;
                await drawSceneAtTime(0);
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء التحميل";
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
</body>
</html>
