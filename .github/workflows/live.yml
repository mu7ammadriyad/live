name: Quran Live Stream Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'اختر وضع التشغيل'
        required: true
        default: 'dummy_test'
        type: choice
        options:
          - dummy_test  # يسجل دقيقة ويرفعها في Releases لتتأكد من الصوت والصورة
          - live        # يشغل البث المباشر الحقيقي على يوتيوب
          - test_fps    # يقيس سرعة الفريمات في الثانية فقط

permissions:
  contents: write

jobs:
  broadcaster:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: 1. تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. تثبيت FFmpeg والحزم
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install

      - name: 4. تشغيل المحرك الموحد
        env:
          MODE: ${{ github.event.inputs.mode }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node stream-live.js
