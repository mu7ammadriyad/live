name: Quran Live Stream Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'اختر وضع التشغيل'
        required: true
        default: 'dummy_test'
        type: choice
        options:
          - dummy_test  # بث وهمي لمدة دقيقة واختبار التزامن والرفع لـ Releases
          - test_fps    # اختبار قدرة السيرفر على ضخ الفريمات
          - live        # بث مباشر حقيقي لليوتيوب

# إعطاء صلاحية رفع الملفات للـ Releases
permissions:
  contents: write

jobs:
  broadcaster:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: 1. تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. تثبيت FFmpeg والحزم البرمجية
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install

      - name: 4. [وضع قياس الفريمات]
        if: ${{ github.event.inputs.mode == 'test_fps' }}
        run: node test-fps.js

      - name: 5. [وضع البث الوهمي واختبار التزامن والرفع للـ Releases]
        if: ${{ github.event.inputs.mode == 'dummy_test' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # توكن جيتهاب التلقائي للرفع
        run: node stream-test.js

      - name: 6. [وضع البث المباشر الحقيقي لليوتيوب]
        if: ${{ github.event.inputs.mode == 'live' }}
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node stream-live.js
